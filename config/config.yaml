# profanity-hush — pipeline configuration
# ============================================================================
# This file IS the default for every setting below -- there is no separate,
# hardcoded fallback anywhere in src/*.py any more. It's baked into the
# Docker image at build time (see Dockerfile), so even a container with no
# host config directory mounted at all runs on exactly what's written here.
# To change a default: edit this file and rebuild the image. Nothing in
# src/*.py needs to change. (A host-mounted config.yaml, if you use one --
# see hush.sh -c / docker-compose.yml's CONFIG_DIR -- only needs to specify
# the settings it wants to override; everything else still inherits from
# here. See utils.load_config() for the exact merge behaviour.)
#
# All settings here can also be overridden by environment variables (see
# bottom). For unattended overnight runs, the defaults in this file are
# already tuned for quality over speed. Processing a 2-hour film at the
# defaults takes roughly 3-4 hours on a 16 GB CPU machine (Steps 2+3
# combined); queue it before bed.
# ============================================================================


# ── Audio source separation (Step 2) ────────────────────────────────────────
demucs:

  # Model variant.
  #   htdemucs_ft  — Fine-tuned Hybrid Transformer v4, 4-stem.
  #                  Best overall quality; recommended default.
  #   htdemucs     — Hybrid Transformer v4, un-fine-tuned; slightly faster.
  #   htdemucs_6s  — 6-stem variant; may improve dialog isolation on dense
  #                  action-film mixes at the cost of significantly more
  #                  compute time.  See §11, open question 3.
  model: htdemucs_ft

  device: cpu

  # Random temporal shift averaging.
  # Higher values improve quality at proportional compute cost.
  #   1  — fast; good quality; recommended default for overnight runs
  #        Measured: ~1.09× realtime on a 16 GB machine (2-hour film → ~2.2 hrs)
  #   4  — improved quality; ~4× slower
  #        Estimated: ~4.4× realtime ≈ ~8.7 hrs for a 2-hour film (not yet
  #        directly measured — linear scaling from shifts=1 is unverified)
  #   10 — maximum quality; roughly 2.5× slower than shifts=4
  # Override with AC_SEGMENT_SIZE env var for the segment size (not shifts).
  shifts: 1


# ── Transcription & word-level alignment (Step 3) ───────────────────────────
#
# segment_size_sec — Step 3's OWN segmentation, deliberately independent of
#   Demucs's own audio.segment_size_sec below (see that setting's own
#   comment for what audio.segment_size_sec is actually for). Splits the
#   already-Demucs-separated dialog.wav (Step 2b's canonical output, not
#   audio_stereo.wav) into dialog_transcribe_NN.wav pieces of at most this
#   many seconds before handing them to whichever engine(s) are enabled --
#   or, at the default of 0, skips splitting entirely and transcribes the
#   whole film as one piece per engine.
#
#   Why a SEPARATE setting rather than reusing audio.segment_size_sec: that
#   setting exists purely because Demucs's source-separation network needs
#   its peak memory bounded (a 2-hour file at full quality exhausts 16 GB
#   RAM) -- nothing about transcription shares that constraint. Every
#   engine this pipeline supports already does its own internal handling
#   of long audio, independent of whatever segment size this pipeline
#   hands it: WhisperX's own faster-whisper call does its own internal
#   ~30-SECOND decode-window chunking regardless (this is the actual
#   mechanism behind docs/timestamp-drift-investigation.md's drift bug --
#   a different, much finer-grained layer than this setting, and one this
#   setting has never controlled); MFA re-chunks internally within
#   whatever segment it's handed (alignment.engines.mfa.chunk_target_sec,
#   25 SECONDS by default); CrisperWhisper has its own longform_strategy.
#   What a SMALLER job-level segment size buys Demucs -- bounded memory --
#   has nothing to do with transcription accuracy. What it CAN cost
#   transcription: a fixed, wall-clock-offset cut has no idea where a word
#   or sentence actually falls, so a boundary Demucs shrugs off can still
#   land a recognition engine mid-word -- silently producing exactly the
#   kind of false negative the correction workflow
#   (--skip-index/--add-interval) exists to catch after the fact.
#
#   0 (default) — no segmentation at all; each engine transcribes the
#     whole film in one call. Directly eliminates the mid-word-split risk
#     above, since there's no job-level cut left to land on anything.
#     Trade-off: this pipeline's per-segment resume granularity (Step 3
#     picks up mid-transcription after a Ctrl-C/crash by skipping
#     segments whose transcript_NN.json already exists) collapses to "the
#     whole film, or nothing" -- an interrupted run loses however much of
#     the film had already been transcribed, not just the current chunk.
#     If you're iterating a lot (trying different engines back to back --
#     see pipeline.py's --redo-step 3_transcribe, which reuses this same
#     setting on every redo) and would rather trade some of that
#     word-splitting protection back for interrupt resilience, set this to
#     something well above audio.segment_size_sec below (e.g. 3600) so
#     there are still meaningfully fewer, and differently-placed,
#     boundaries than Demucs's own.
#   > 0 — split into pieces of at most this many seconds, same fixed-size
#     chunking audio.segment_size_sec already does, just against dialog.wav
#     instead of audio_stereo.wav (steps/segment.py's split_into_segments()
#     is the one shared mechanism both settings ultimately go through).
#
#   Changing this between runs of the SAME job (e.g. via
#   --redo-step 3_transcribe) is safe -- Step 3 always recomputes its own
#   segmentation fresh from dialog.wav's own probed duration and this
#   value, never reusing a previous run's segment count or boundaries.
#   Override with AC_ALIGNMENT_SEGMENT_SIZE env var.
alignment:
  segment_size_sec: 0

  # Every engine this pipeline knows how to run, and what to do with each
  # one's output, lives under alignment.engines below. Each engine is fully
  # independent and separately toggled -- there is no "authoritative
  # backend" setting any more, and no implicit "run everything up to the
  # authoritative one" cascade the way earlier versions of this pipeline
  # had (a single alignment.backend value, plus an alignment.dual_output
  # on/off switch that ran a second engine purely for comparison). An
  # engine runs if and only if its own `enabled` is true, full stop, with
  # exactly one narrow, documented exception (alignment.engines.whisperx,
  # below) that's a structural dependency, not a policy choice.
  #
  # See docs/timestamp-drift-investigation.md for why mfa and crisperwhisper
  # exist at all: whisperx's own wav2vec2/CTC alignment was found to
  # silently drift several seconds following a segment WhisperX's own
  # transcribe() pass mis-timed internally, and for the validated
  # comparison between whisperx and mfa on Independence Day (1996).
  # crisperwhisper was tested the same way, directly against the same
  # film, and found more accurate than both -- see
  # steps/transcribe_crisperwhisper.py's own module docstring for the full
  # writeup, which is why it's this config's default final engine below.
  #
  # For each engine, five settings mean the same thing everywhere (see
  # steps/transcribe.py's own module docstring for the full mechanics):
  #
  #   enabled          — Transcribe? Whether this engine runs at all this
  #                       job. false means genuinely zero compute spent on
  #                       it -- with ONE documented exception: see
  #                       alignment.engines.whisperx's own comment below.
  #   debug_subtitle    — Debug subtitle? Export this engine's own,
  #                       unedited transcript as a per-engine comparison
  #                       subtitle track (karaoke-highlighted, per
  #                       transcript_srt.karaoke below) -- see
  #                       steps/transcript_srt.py. Requires enabled: true.
  #   final             — Final transcript? Is THIS engine's transcript
  #                       the authoritative one -- the one Step 4b actually
  #                       flags words against, and Step 5 actually
  #                       mutes/beeps from. Exactly one enabled engine
  #                       must have this set to true (checked at startup,
  #                       before Step 1a runs -- see
  #                       utils.validate_alignment_engines()).
  #   final_subtitle    — Final subtitle? Only consulted on whichever
  #                       engine has final: true. Whether to also export
  #                       that transcript as the "final" subtitle track --
  #                       plain text, no karaoke highlighting, with muted
  #                       words redacted per transcript_srt.hush below.
  #                       You can use an engine for muting without wanting
  #                       a subtitle file out of it at all by leaving this
  #                       false.
  #   embed_subtitle    — Embed subtitle? Whether to mux this engine's own
  #                       subtitle output(s) -- its debug track (if
  #                       debug_subtitle above) and/or the final track (if
  #                       this engine is final and final_subtitle above)
  #                       -- into the delivered output video
  #                       (steps/mux.py), on top of writing it to the job
  #                       directory / sidecar either way (which always
  #                       happens regardless of this setting).
  #
  # Each engine's own model/backend settings follow those five in the same
  # block.
  #
  # Default engine selection (this version): crisperwhisper only --
  # whisperx and mfa are both off, having been superseded by
  # crisperwhisper's own validated accuracy. Both remain fully implemented
  # and one config edit away from being turned back on -- e.g. to
  # re-evaluate a future whisperx/mfa release, to add a second engine's
  # debug_subtitle purely for comparison, or to fall back to either if
  # crisperwhisper ever regresses. Flip enabled (and whichever of
  # debug_subtitle/final/final_subtitle/embed_subtitle you want) back to
  # true; nothing else in this pipeline needs to change.
  engines:

    whisperx:
      enabled:         false
      debug_subtitle:  false
      final:           false
      final_subtitle:  false
      embed_subtitle:  false

      # wav2vec2/CTC alignment within whatever ~30s decode-chunk boundary
      # WhisperX's own transcribe() pass already committed to. Cheapest
      # of the three engines, but the one most exposed to the drift
      # failure mode documented in docs/timestamp-drift-investigation.md.
      #
      # IMPORTANT -- read before assuming "enabled: false" means zero
      # cost: WhisperX's own recognition + this alignment pass ALSO runs
      # whenever alignment.engines.mfa.enabled is true below, REGARDLESS
      # of this enabled value. MFA re-times WhisperX's own recognized
      # text -- it does not recognize speech itself (see
      # alignment.engines.mfa's own comment, and
      # steps/align_mfa.py's module docstring) -- so it structurally
      # depends on this engine's output existing, whether or not you
      # also want that output exposed as its own transcript/subtitle.
      # Setting this to false with mfa.enabled: true does NOT skip that
      # recognition+alignment work -- it only skips WRITING it out as
      # its own transcript_whisperx_NN.json / making it selectable as a
      # debug subtitle or as final. Set both true if you want to see
      # WhisperX's own result alongside MFA's. With the default config
      # below (mfa also off), this engine's own recognition genuinely
      # never runs at all, and the whisperx package is never even
      # imported.
      model: large-v2        # large-v2 | large-v3 | medium | small
      language: en           # ISO 639-1; null for auto-detect
      batch_size: 4
      beam_size: 5
      device: cpu
      compute_type: int8     # int8 (CPU, recommended) | float32 | float16 (GPU only)

    mfa:
      enabled:         false
      debug_subtitle:  false
      final:           false
      final_subtitle:  false
      embed_subtitle:  false

      # Montreal Forced Aligner (GMM-HMM via Kaldi). Re-times WhisperX's
      # own recognized text by searching for it across the WHOLE audio
      # handed to it, rather than trusting WhisperX's own ~30s
      # decode-chunk boundaries -- see docs/timestamp-drift-investigation.md
      # for the validated before/after numbers against whisperx alone,
      # and steps/align_mfa.py's module docstring for the chunking
      # design (needed to keep individual align_one calls fast) and the
      # two earlier chunking attempts that made timing WORSE, not
      # better. Requires the `montreal-forced-aligner` conda package
      # (see Dockerfile) -- NOT pip-installable; needs kalpy (compiled
      # Kaldi bindings), which conda-forge ships prebuilt and PyPI does
      # not carry at all.
      #
      # MFA never performs its own speech recognition -- see the note on
      # alignment.engines.whisperx above for what that means when this
      # is enabled but whisperx.enabled is left false.
      acoustic_model: english_mfa
      dictionary: english_mfa

      # G2P (grapheme-to-phoneme) model used to generate a pronunciation
      # on the fly for words the dictionary doesn't have an entry for,
      # instead of silently dropping them. Film dialogue leans heavily
      # on contractions and dropped-g colloquialisms ("sayin'", "outta",
      # "gonna") that a standard dictionary won't have every variant of
      # — leave this set rather than relying on the dictionary alone.
      g2p_model: english_us_mfa

      # Kaldi beam widths. 100/400 are MFA's own basic_align.yaml
      # defaults, tuned for utterances under 30 seconds -- raised here
      # to 400/1000 (MFA's own documented example figure for "much
      # longer sequences") back when every call handed align_one an
      # entire ~30-minute segment as one utterance; now that
      # chunk_target_sec below keeps each individual align_one call
      # under MFA's own <30s sweet spot, these are probably wider than
      # strictly needed but are left at their proven-safe values.
      beam: 400
      retry_beam: 1000

      # Target duration (seconds) for one align_one call -- chunks are
      # built from consecutive whisper_segments (never splitting one) up
      # to this length. See steps/align_mfa.py's module docstring for
      # why chunking exists at all and why staying under MFA's own
      # documented ~30s-per-utterance guidance matters. Independent of
      # alignment.segment_size_sec above -- that setting decides how big
      # a piece of dialog.wav Step 3 hands to MFA at all; this setting
      # decides how MFA itself subdivides whatever it's handed.
      chunk_target_sec: 25

      # Small, FIXED margin added on each side of a chunk's own claimed
      # [start, end] before slicing -- just enough to not clip the very
      # first/last phone of real speech at an imprecise boundary,
      # nothing more. NOT a search window -- see steps/align_mfa.py's
      # module docstring for two earlier, more generous designs that
      # were tried and confirmed (against real audio) to make timing
      # WORSE than plain whisperx alignment.
      chunk_edge_margin_sec: 0.3

      # Per-call timeout. A chunk this small should finish in low
      # single-digit seconds even at the beam widths above -- this is
      # deliberately generous rather than tuned tight, since a chunk
      # timing out just degrades that one chunk to WhisperX's own timing
      # (see fallback_to_whisperx below) rather than failing anything.
      chunk_timeout_sec: 120

      # If a whole job-segment's worth of MFA alignment fails outright
      # (no conda, models not downloaded, G2P grapheme lookup failing --
      # environment problems every chunk in that segment would hit
      # identically), fall back to WhisperX's own alignment (already
      # computed -- see alignment.engines.whisperx's note above) for
      # that segment's words rather than leaving a gap there. This is
      # separate from, and in addition to, the PER-CHUNK fallback
      # steps/align_mfa.py always applies regardless of this setting (a
      # single failed/rejected chunk degrades to WhisperX timing for
      # just that chunk and keeps going) -- this one covers the coarser
      # case where MFA couldn't even get started for the whole segment.
      # This only ever affects the AUTHORITATIVE transcript when mfa is
      # the final engine -- MFA's own debug-subtitle transcript (if
      # enabled) stays an honest, unmodified record of what MFA itself
      # produced either way, which for a totally-failed segment is
      # nothing. See steps/transcribe.py's own module docstring.
      fallback_to_whisperx: true

    crisperwhisper:
      enabled:         true
      debug_subtitle:  true
      final:           true
      final_subtitle:  true
      embed_subtitle:  false

      # An independently-trained model that transcribes each segment's
      # audio directly, rather than re-timing WhisperX's own recognized
      # text the way whisperx/mfa above do -- see
      # steps/transcribe_crisperwhisper.py's module docstring for the
      # full reasoning (short version: every whisperx/mfa fix works by
      # searching, after the fact, for where WhisperX's own drifted
      # audio actually is, which has proven fragile more than once in
      # this project's own history; this instead never depends on
      # WhisperX's segment timing in the first place, and shares no
      # computation with either of those two engines at all). Tested
      # directly against Independence Day (1996) and found more
      # accurate than both whisperx and mfa on that comparison -- this
      # is why it's the default final engine here, with whisperx/mfa
      # both off. A segment where this engine fails has NO other engine
      # to fall back to unless you've also enabled one (see
      # alignment.engines.mfa/whisperx above) -- with the default
      # config (this engine only), a failed segment simply has no data
      # for that stretch of transcript.json, the same as a genuinely
      # silent segment already has today.
      #
      # Model weights are under a non-commercial research license, not
      # MIT the way the inference code is -- confirm this fits your use
      # before enabling.
      model: large            # large | turbo | medium | small -- NOT the
                               # _pro variants (separate commercial-only license)

      # ISO 639-1. Independent of alignment.engines.whisperx.language --
      # this engine shares no computation with whisperx, so it has its
      # own setting rather than implicitly borrowing that one. Unlike
      # whisperx's own language setting, null here does NOT mean
      # auto-detect -- this engine's transcribe() call has no such mode;
      # null/empty just becomes "en" (see
      # steps/transcribe_crisperwhisper.py's own "language or en"
      # fallback).
      language: en

      # ct2 (CTranslate2) -- crisperwhisper's own default preference
      # (backend="auto" tries this first), typically faster on CPU than
      # the alternative (transformers, raw HuggingFace/torch), and no
      # quality cost vs. transformers when compute_type below is set
      # explicitly, since float32 is a first-class option on both -- see
      # steps/transcribe_crisperwhisper.py's own module docstring
      # (BACKEND CHOICE) for the real tradeoff, including a confirmed
      # (not hypothetical) dependency-naming risk and why it isn't a
      # reason to avoid this.
      backend: ct2

      device: cpu

      # ALWAYS float32 on a CPU device, on EITHER backend -- deliberately
      # not left at either one's own default. Confirmed by reading
      # crisperwhisper's actual source (not just its README): the
      # transformers backend's compute_type maps directly to a torch dtype
      # with no CPU-aware adjustment (float16 on CPU is unreliable/slow on
      # many kernels), and ct2's own model-conversion step defaults its
      # quantization to float16 too (a smaller but real precision cost).
      # float32 is a genuinely first-class, fully-supported option on both
      # backends, not a fallback -- see
      # steps/transcribe_crisperwhisper.py's own docstring.
      compute_type: float32


# ── Audio handling (Steps 1a / 1b / 1c) ─────────────────────────────────────
audio:
  # v1: all source audio is downmixed to stereo (44.1 kHz, PCM 16-bit) for
  # processing.  The original audio track is preserved as-is in the job store
  # as a bitstream copy (audio_raw.{ext}), so future per-channel processing
  # (see §13.3) can re-run from Step 1b without touching the video again.

  # Maximum audio chunk sent to Demucs in one pass, in seconds -- Step 1c
  # splits audio_stereo.wav into pieces of at most this size specifically
  # for Step 2 (Demucs)'s own benefit. Demucs loads the entire segment into
  # RAM; reducing this is the primary lever for keeping peak memory within
  # budget on low-RAM machines. Step 3 (transcribe) no longer inherits this
  # value or this split at all -- see alignment.segment_size_sec above for
  # transcription's own, independent segmentation, and why the two are
  # allowed to disagree.
  #   1800 — 30 minutes; recommended default (works within 16 GB)
  #   900  — 15 minutes; use if you see OOM on machines with < 16 GB RAM
  #   0    — disable segmentation (process the whole file at once — not
  #           recommended for feature-length films, given Demucs's own
  #           memory profile)
  # Override with AC_SEGMENT_SIZE env var (value in seconds).
  segment_size_sec: 1800


# ── SRT subtitle cross-reference (Step 4) ───────────────────────────────────
srt:

  # Use an SRT file if one is found alongside the input video, or if one is
  # explicitly provided on the command line.
  enabled: true

  # Conflict resolution strategy when WhisperX timing and SRT timing disagree.
  #   whisperx_primary  — trust WhisperX timestamps; use SRT only to confirm
  #                       word identity (default, recommended for v1)
  #   srt_primary       — trust SRT segment boundaries; override WhisperX timing
  #   highest_confidence — use whichever source has the higher confidence score
  strategy: whisperx_primary

  # Minimum fuzz-match score (0–100) to accept an SRT segment as a match
  # for a transcript word.  85 is a good starting point; lower if you find
  # too many missed matches, raise if you get false matches.
  fuzzy_threshold: 85


# ── Interactive review (Step 4b) ─────────────────────────────────────────────
interactive:

  # Set to true to enable the review prompt by default.
  # Can be overridden at runtime with --interactive / --no-interactive.
  enabled: false

  # Number of transcript words shown on each side of a flagged entry for
  # context.  Increase if you find the surrounding context too narrow to
  # make a confident approve/reject decision.
  show_context_words: 8

  # Confidence threshold for auto-approval. A flagged word is auto-approved
  # (never shown in the review prompt) only when its confidence is
  # STRICTLY GREATER than this value (see steps/review.py).
  #   0.0  — prompt for every flagged word regardless of confidence (default;
  #          special-cased to always prompt, rather than "score > 0.0", since
  #          nearly every real match would otherwise clear that bar)
  #   0.7  — auto-approve words with confidence > 0.7; prompt for the rest
  #   1.0  — NOT "auto-approve everything": confidence never exceeds 1.0, so
  #          nothing can ever be "> 1.0" -- this behaves the same as 0.0
  #          (prompt for every flagged word). There is no threshold value
  #          that skips review entirely; run without --interactive for that.
  # Use this to reduce review burden when most detections are high-confidence.
  # See §13.6 for the full Confidence-Guided Review roadmap item.
  min_confidence_for_prompt: 0.0


# ── Censoring behaviour (Step 5) ─────────────────────────────────────────────
censoring:

  # How to replace the flagged audio interval.
  #   mute  — replace with silence (default; clean, unambiguous)
  #   beep  — NOT YET IMPLEMENTED. Selecting this fails the run outright
  #           at Step 5 with a clear error, rather than silently doing
  #           nothing or falling back to mute -- see design doc §10,
  #           Phase 4, for the planned implementation.
  method: mute

  # Frequency of the beep tone in Hz.  Only used once method: beep is
  # implemented (see the note above) -- currently unused.
  # 1000 Hz is the classic broadcast censor tone.
  beep_frequency_hz: 1000

  # Padding added before and after each muted word, in milliseconds.
  # Prevents audible pops/clicks at edit boundaries.
  # 50 ms is a reasonable default; increase if clipping is audible,
  # decrease if adjacent words are accidentally muted.
  padding_ms: 50

  # Path to the word list file inside the container.
  # This should not need to change; word_list.txt lives in /config.
  word_list: /config/word_list.txt


# ── Output (Steps 6 / 7) ─────────────────────────────────────────────────────
output:

  # How to build the output filename.
  #   plex_edition — Plex-friendly {edition-Name} tag (default). See
  #                  edition_name below. Movies and TV episodes are
  #                  tagged at different points in the filename — see
  #                  steps/mux.py's _output_path() for the full reasoning
  #                  and the ellipsis-safe title/tech-tag boundary logic
  #                  it depends on:
  #                    "Movie (1986).sd.hevc.mkv" ->
  #                    "Movie (1986) {edition-Hushed}.sd.hevc.mkv"
  #                    "Psych (2006) - s02e01 - American Duos.sd.hevc.mkv" ->
  #                    "Psych (2006) - s02e01 - American Duos {edition-Hushed}.sd.hevc.mkv"
  #                  Falls back to appending the tag at the very end
  #                  (still valid Plex syntax — tag order doesn't matter
  #                  to Plex's parser) if neither pattern applies.
  #   suffix       — plain suffix appended before the extension; no Plex
  #                  Edition semantics, just a renamed file. See suffix
  #                  below.
  naming_style: plex_edition

  # Edition name used inside the {edition-...} tag.
  # Only used when naming_style: plex_edition.
  edition_name: Hushed

  # String appended to the input filename before the extension.
  # "movie.mkv" → "movie_censored.mkv"
  # Only used when naming_style: suffix.
  suffix: _censored

  # Output container format.
  #   mkv  — Matroska; recommended (flexible codec support, full subtitle/
  #          chapter/attachment passthrough, muxed with mkvmerge — see
  #          steps/mux.py for why mkvmerge rather than ffmpeg)
  #   mp4  — if you need a file that plays on more devices out of the box
  #          (muxed with ffmpeg; no subtitle/attachment passthrough)
  format: mkv

  # Whether to keep the large intermediate WAV/audio stems (audio_stereo.wav,
  # dialog.wav, score_sfx.wav, dialog_censored.wav, audio_censored.wav,
  # audio_encoded.mka) AND the per-segment transcript_NN.json /
  # dialog_transcribe_NN.wav files after a successful run. Each is deleted
  # by whichever step finishes consuming it (Steps 2b, 3b, 5, 6, 6b, and 7
  # respectively) once it's no longer needed -- never by the step that
  # produced it.
  # transcript.json (the merged file, not the per-segment transcript_NN.json
  # above), matches.json, review.json, and censor_log.json are ALWAYS kept
  # regardless of this setting -- they're needed for the correction workflow
  # (see keep_correction_artifacts below, and --skip-index / --add-interval /
  # --redo-review / --redo-step 3_transcribe on the command line).
  # transcript_NN.json/dialog_transcribe_NN.wav are NOT among these: they're
  # only ever read once, by Step 3b (merge_transcript), to build
  # transcript.json -- every correction/redo workflow reads transcript.json
  # or dialog.wav directly, never these per-segment files.
  # Override with --keep-tmp on the command line or AC_KEEP_INTERMEDIATES=1.
  keep_intermediates: false

  # Whether to keep dialog.wav and score_sfx.wav specifically, independent
  # of keep_intermediates above. These two are what make a correction (or a
  # --redo-step 3_transcribe) cheap: re-running hush with --skip-index /
  # --add-interval / --redo-review only needs to redo Steps 5-7 (a few
  # minutes) if they're still on disk, and --redo-step 3_transcribe only
  # needs to redo Steps 3 onward (no Demucs) -- without them, either
  # workflow needs Step 2's Demucs separation all over again (the most
  # expensive step in the whole pipeline, often well over an hour).
  # Recommended to leave this at its default of true unless disk space is
  # tight and you're confident you won't need to correct anything or try a
  # different transcription engine later.
  keep_correction_artifacts: true

  # Log verbosity.  debug includes ffmpeg/demucs/whisperx subprocess output.
  # Timestamps on every log line use the host's local time (auto-detected by
  # hush.sh; see AC_TZ_OFFSET / AC_TZ_NAME below), falling back to clearly
  # labelled UTC if that wasn't forwarded. There's no config.yaml setting for
  # this -- it's host-environment information, not pipeline behaviour.
  log_level: info          # debug | info | warning


# ── Transcript SRT export (Step 6c) ─────────────────────────────────────────
transcript_srt:

  # Master switch for the whole step -- false skips Step 6c entirely,
  # regardless of any engine's own debug_subtitle/final_subtitle. Which
  # SPECIFIC engines get a debug subtitle, and whether the final engine
  # gets one too, is controlled per-engine under alignment.engines above,
  # not here -- see that section's own comment.
  enabled: true

  # Also mux every source whose own alignment.engines.<name>.
  # embed_subtitle is true into the final output video (steps/mux.py) --
  # on top of write_sidecar below, not instead of it; the two aren't
  # mutually exclusive. Each source's embed_subtitle defaults to false
  # FOR NOW, DURING DEVELOPMENT: a sidecar file is trivial to delete or
  # regenerate while grouping/karaoke settings are still being tuned,
  # where re-muxing the whole container is not. Revisit per-engine once
  # settled.

  # Write each available SRT next to the final output video too, using
  # the same base name as the video plus a language and engine-name tag.
  # Independent of, and always on top of, the job-directory copy, which
  # is unconditional whenever a source is available -- this setting only
  # controls the extra copy placed next to the video itself.
  write_sidecar: true

  # Karaoke-style highlighting: color the single word actually being
  # spoken at each instant, rather than only grouping words like a
  # traditional subtitle track. Applies ONLY to each engine's own
  # debug_subtitle SRT -- NEVER the authoritative one, which is always
  # the plain, one-cue-per-group rendering regardless of this setting.
  karaoke: true

  # Color applied to the currently-spoken word when karaoke is true.
  karaoke_color: "#FFD400"

  # ── Hushing: how words the pipeline actually muted are rendered in the
  # AUTHORITATIVE SRT's own text -- NEVER a per-engine debug SRT.
  hush:

    # keep       — leave every word exactly as the final engine
    #              recognized it.
    # simple     — replace with either a fixed token or a same-length
    #              character mask -- see simple_style below. DEFAULT.
    # substitute — NOT YET IMPLEMENTED.
    mode: simple

    # "mode: simple" only. How the replacement text is built.
    #   token — every hushed word becomes simple_token, verbatim.
    #   mask  — same length as the original word (or mask_fixed_length,
    #           if set above 0), built from mask_character. DEFAULT.
    simple_style: mask

    # "simple_style: token" only. The literal replacement text.
    simple_token: "[hushed]"

    # "simple_style: mask" only. The character repeated to build the
    # mask. Only the first character is used if more than one is given.
    mask_character: "*"

    # "simple_style: mask" only. Show the word's real first letter before
    # the mask.
    mask_preserve_first: true

    # "simple_style: mask" only. Show the word's real last letter after
    # the mask.
    mask_preserve_last: false

    # "simple_style: mask" only. Mask length in characters, regardless of
    # the real word's own length. 0 (default) matches the real word's own
    # length instead.
    mask_fixed_length: 0

  # ── Grouping: how recognized words are bundled into subtitle lines ──────
  max_words_per_group: 12
  max_group_gap_sec: 0.7
  max_group_duration_sec: 7.0
  max_chars_per_line: 42
  max_lines_per_group: 2

  # Embedded subtitle track metadata (steps/mux.py) -- the prefix for
  # what a player's subtitle track picker shows for each track.
  track_name_prefix: "Hushed Transcript"

  # ISO 639-2 (3-letter) language code for every embedded track and every
  # sidecar filename.
  track_language: eng


# ── Job storage ───────────────────────────────────────────────────────────────
storage:

  # Mount point for the jobs directory inside the container.
  # Maps to the host path set by --jobs (default: ~/.local/share/profanity-hush/jobs).
  jobs_dir: /jobs


# ── Environment variable overrides ───────────────────────────────────────────
# The following env vars, if set in the host environment before calling hush.sh,
# override the corresponding config.yaml values inside the container:
#
#   AC_LOG_LEVEL                  info | debug | warning
#   AC_KEEP_INTERMEDIATES         1  → keep large WAV stems after run
#   AC_KEEP_CORRECTION_ARTIFACTS  1  → keep dialog.wav/score_sfx.wav (default)
#                                  0  → also delete them (this one defaults to
#                                       true, so unlike the others above, only
#                                       explicitly turning it *off* has an effect)
#   AC_INTERACTIVE                1  → enable interactive review (same as --interactive)
#   AC_SEGMENT_SIZE                override audio.segment_size_sec (seconds); 0 = no segmentation
#   AC_ALIGNMENT_SEGMENT_SIZE      override alignment.segment_size_sec (seconds); 0 = no segmentation
#                                  (Step 3's own, independent of AC_SEGMENT_SIZE/audio.segment_size_sec)
#   AC_TZ_OFFSET / AC_TZ_NAME      host UTC offset (e.g. "-0700") / cosmetic
#                                  abbreviation (e.g. "PDT") for log timestamps --
#                                  not a config.yaml setting, since this is
#                                  information about the host environment, not
#                                  pipeline behaviour. hush.sh sets both
#                                  automatically; falls back to UTC if absent.
#   AC_INPUT_HOST_DIR / AC_OUTPUT_HOST_DIR
#                                  host-side paths corresponding to /input and
#                                  /output inside the container, for logging
#                                  host-navigable paths in job.json and the
#                                  final summary.
#
# Examples:
#   AC_LOG_LEVEL=debug ./hush.sh movie.mkv
#   AC_SEGMENT_SIZE=900 ./hush.sh movie.mkv   # 15-min Demucs segments for low-RAM machines
#   AC_ALIGNMENT_SEGMENT_SIZE=3600 ./hush.sh --redo-step 3_transcribe movie.mkv
#       # try transcription in 1-hour pieces instead of the default (whole film)
